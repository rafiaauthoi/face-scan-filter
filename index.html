<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Face Scan Filter</title>
  <script src="https://cdn.jsdelivr.net/npm/tone@14.8.49/build/Tone.js"></script>
  <style>
    body {
      background-color: #050505;
      color: #eaeaea;
      font-family: monospace;
      text-align: center;
      padding-top: 30px;
      margin: 0;
    }

    h1 {
      color: #ff2fb0;
      text-shadow: 0 0 12px #ff2fb0;
      letter-spacing: 2px;
    }

    #startButton, #captureButton {
      background-color: #ff2fb0;
      color: #0a0a0a;
      border: none;
      padding: 12px 24px;
      font-family: monospace;
      font-size: 14px;
      font-weight: bold;
      border-radius: 6px;
      cursor: pointer;
      margin-top: 10px;
    }

    #startButton:hover, #captureButton:hover {
      background-color: #ff5fc4;
    }

    #captureButton {
      display: none;
      background-color: #7fffd4;
      color: #050505;
    }

    #captureButton:hover {
      background-color: #a3ffe4;
    }

    #video-wrapper {
      position: relative;
      width: 65vw;
      max-width: 950px;
      aspect-ratio: 4 / 3;
      margin: 20px auto 0;
      border: 2px solid #ff2fb0;
      border-radius: 8px;
      overflow: hidden;
      box-shadow: 0 0 30px rgba(255, 47, 176, 0.4);
      background-color: #000;
    }

    video {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      transform: scaleX(-1);
      opacity: 0.55;
    }

    canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      transform: scaleX(-1);
    }

    #flash-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-color: rgba(255, 255, 255, 0.9);
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.5s ease;
    }

    #status {
      margin-top: 14px;
      font-size: 14px;
      color: #888;
    }
  </style>
</head>
<body>

  <h1>FACE SCAN FILTER</h1>
  <button id="startButton">Start Scan</button>
  <button id="captureButton">Capture Snapshot</button>

  <div id="video-wrapper">
    <video id="webcam" autoplay playsinline></video>
    <canvas id="overlay" width="960" height="720"></canvas>
    <div id="flash-overlay"></div>
  </div>
  <p id="status">Click "Start Scan" to begin.</p>

  <script type="module">
    import {
      FaceLandmarker,
      FilesetResolver
    } from "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14";

    const video = document.getElementById('webcam');
    const canvas = document.getElementById('overlay');
    const ctx = canvas.getContext('2d');
    const status = document.getElementById('status');
    const startButton = document.getElementById('startButton');
    const captureButton = document.getElementById('captureButton');
    const flashOverlay = document.getElementById('flash-overlay');

    let faceLandmarker;
    let audioReady = false;
    let chargeSynth, releaseSynth, releaseNoise, releaseBoom, shutterNoise;

    // mouth openness (scaled by face size) mapped directly to charge, 0 to 1
    const MOUTH_OPEN_MIN = 0.045;
    const MOUTH_OPEN_MAX = 0.16;
    const REARM_THRESHOLD = 0.12; // mouth must close back down below this to trigger again

    const HUE_BASE = [320, 170];

    let wasFacePresent = [false, false];
    let charge = [0, 0];
    let armed = [true, true];
    let motes = [[], []];
    let burstParticles = [];
    let shockwaves = [];

    function mapRange(value, inMin, inMax, outMin, outMax) {
      const t = Math.max(0, Math.min(1, (value - inMin) / (inMax - inMin)));
      return outMin + t * (outMax - outMin);
    }

    async function setupAudio() {
      await Tone.start();

      chargeSynth = new Tone.Synth({
        oscillator: { type: 'sine' },
        envelope: { attack: 0.05, decay: 0.1, sustain: 0.6, release: 0.1 }
      }).toDestination();
      chargeSynth.volume.value = -18;

      releaseSynth = new Tone.Synth({
        oscillator: { type: 'sawtooth' },
        envelope: { attack: 0.001, decay: 0.5, sustain: 0, release: 0.3 }
      }).toDestination();
      releaseSynth.volume.value = -4;

      releaseNoise = new Tone.NoiseSynth({
        noise: { type: 'brown' },
        envelope: { attack: 0.001, decay: 0.4, sustain: 0 }
      }).toDestination();
      releaseNoise.volume.value = -6;

      releaseBoom = new Tone.MembraneSynth({
        pitchDecay: 0.1,
        octaves: 6,
        envelope: { attack: 0.001, decay: 0.5, sustain: 0 }
      }).toDestination();
      releaseBoom.volume.value = -2;

      shutterNoise = new Tone.NoiseSynth({
        noise: { type: 'white' },
        envelope: { attack: 0.001, decay: 0.05, sustain: 0 }
      }).toDestination();
      shutterNoise.volume.value = -8;

      await Tone.loaded();
      audioReady = true;
    }

    async function setupFaceLandmarker() {
      const vision = await FilesetResolver.forVisionTasks(
        "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/wasm"
      );

      faceLandmarker = await FaceLandmarker.createFromOptions(vision, {
        baseOptions: {
          modelAssetPath:
            "https://storage.googleapis.com/mediapipe-models/face_landmarker/face_landmarker/float16/1/face_landmarker.task",
          delegate: "GPU"
        },
        runningMode: "VIDEO",
        numFaces: 2
      });

      status.textContent = "Model loaded. Starting camera...";
      startWebcam();
    }

    async function startWebcam() {
      try {
        const stream = await navigator.mediaDevices.getUserMedia({
          video: {
            width: { ideal: 640 },
            height: { ideal: 480 }
          },
          audio: false
        });
        video.srcObject = stream;

        video.addEventListener('loadeddata', () => {
          status.textContent = "Open your mouth wide to charge and release.";
          captureButton.style.display = 'inline-block';
          animationLoop();
        });
      } catch (error) {
        status.textContent = "Camera access failed: " + error.message;
      }
    }

    startButton.addEventListener('click', async () => {
      startButton.disabled = true;
      startButton.textContent = "Starting...";
      try {
        await setupAudio();
      } catch (error) {
        console.error("Audio setup failed, continuing without sound:", error);
      }
      status.textContent = "Loading tracking model...";
      setupFaceLandmarker();
      startButton.style.display = 'none';
    });

    captureButton.addEventListener('click', () => {
      const captureCanvas = document.createElement('canvas');
      captureCanvas.width = canvas.width;
      captureCanvas.height = canvas.height;
      const captureCtx = captureCanvas.getContext('2d');

      captureCtx.translate(captureCanvas.width, 0);
      captureCtx.scale(-1, 1);
      captureCtx.drawImage(video, 0, 0, captureCanvas.width, captureCanvas.height);
      captureCtx.drawImage(canvas, 0, 0);

      captureCanvas.toBlob((blob) => {
        const link = document.createElement('a');
        link.href = URL.createObjectURL(blob);
        link.download = 'face-scan-' + Date.now() + '.png';
        link.click();
      }, 'image/png');

      triggerFlash(0.9);
      if (shutterNoise) shutterNoise.triggerAttackRelease('16n');
    });

    function triggerFlash(strength) {
      flashOverlay.style.transition = 'opacity 0.05s ease';
      flashOverlay.style.opacity = String(strength);
      setTimeout(() => {
        flashOverlay.style.transition = 'opacity 0.5s ease';
        flashOverlay.style.opacity = '0';
      }, 60);
    }

    function spawnBurst(x, y, count, hue) {
      for (let i = 0; i < count; i++) {
        const angle = (Math.PI * 2 * i) / count + Math.random() * 0.3;
        const speed = Math.random() * 9 + 4;
        burstParticles.push({
          x, y,
          vx: Math.cos(angle) * speed,
          vy: Math.sin(angle) * speed,
          alpha: 1,
          radius: Math.random() * 4 + 2,
          hue
        });
      }
    }

    function drawBurstParticles() {
      burstParticles.forEach((p) => {
        p.x += p.vx;
        p.vx *= 0.95;
        p.y += p.vy;
        p.vy *= 0.95;
        p.alpha -= 0.018;
        ctx.fillStyle = `hsla(${p.hue}, 100%, 70%, ${Math.max(0, p.alpha)})`;
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
        ctx.fill();
      });
      burstParticles = burstParticles.filter((p) => p.alpha > 0);
    }

    function spawnShockwave(x, y, hue) {
      shockwaves.push({ x, y, radius: 10, alpha: 1, hue });
    }

    function drawShockwaves() {
      shockwaves.forEach((s) => {
        s.radius += 14;
        s.alpha -= 0.025;
        ctx.strokeStyle = `hsla(${s.hue}, 100%, 70%, ${Math.max(0, s.alpha)})`;
        ctx.lineWidth = 4;
        ctx.beginPath();
        ctx.arc(s.x, s.y, s.radius, 0, Math.PI * 2);
        ctx.stroke();
      });
      shockwaves = shockwaves.filter((s) => s.alpha > 0);
    }

    function drawUnmirroredText(text, x, y, color, fontSize, align) {
      ctx.save();
      ctx.translate(x, y);
      ctx.scale(-1, 1);
      ctx.fillStyle = color;
      ctx.font = fontSize + 'px monospace';
      ctx.textAlign = align || 'center';
      ctx.fillText(text, 0, 0);
      ctx.restore();
    }

    function getBoundingBox(landmarks) {
      let minX = 1, minY = 1, maxX = 0, maxY = 0;
      landmarks.forEach((point) => {
        if (point.x < minX) minX = point.x;
        if (point.x > maxX) maxX = point.x;
        if (point.y < minY) minY = point.y;
        if (point.y > maxY) maxY = point.y;
      });
      return {
        x: minX * canvas.width,
        y: minY * canvas.height,
        width: (maxX - minX) * canvas.width,
        height: (maxY - minY) * canvas.height
      };
    }

    // mouth openness, scaled by face height so it reads consistently regardless
    // of how close the face is to the camera
    function getMouthOpenRatio(face) {
      const upperLip = face[13];
      const lowerLip = face[14];
      const forehead = face[10];
      const chin = face[152];

      const mouthGap = Math.hypot(lowerLip.x - upperLip.x, lowerLip.y - upperLip.y);
      const faceHeight = Math.hypot(chin.x - forehead.x, chin.y - forehead.y);

      return mouthGap / faceHeight;
    }

    function drawChargeRing(box, chargeAmount, hue) {
      const centerX = box.x + box.width / 2;
      const centerY = box.y + box.height / 2;
      const baseRadius = Math.max(box.width, box.height) * 0.65;
      const radius = baseRadius * (0.7 + chargeAmount * 0.5);

      const glowGradient = ctx.createRadialGradient(centerX, centerY, radius * 0.5, centerX, centerY, radius);
      glowGradient.addColorStop(0, `hsla(${hue}, 100%, 65%, ${0.05 + chargeAmount * 0.25})`);
      glowGradient.addColorStop(1, 'rgba(0, 0, 0, 0)');
      ctx.fillStyle = glowGradient;
      ctx.beginPath();
      ctx.arc(centerX, centerY, radius, 0, Math.PI * 2);
      ctx.fill();

      ctx.strokeStyle = `hsla(${hue}, 100%, ${60 + chargeAmount * 20}%, ${0.3 + chargeAmount * 0.6})`;
      ctx.lineWidth = 2 + chargeAmount * 5;
      ctx.beginPath();
      ctx.arc(centerX, centerY, radius, -Math.PI / 2, -Math.PI / 2 + chargeAmount * Math.PI * 2);
      ctx.stroke();
    }

    function spawnMotes(slot, box, hue, intensity) {
      const spawnChance = 0.3 + intensity * 0.6;
      if (Math.random() < spawnChance) {
        const angle = Math.random() * Math.PI * 2;
        const dist = Math.random() * box.width * 0.5;
        const originX = box.x + box.width / 2 + Math.cos(angle) * dist;
        const originY = box.y + box.height / 2 + Math.sin(angle) * dist;

        motes[slot].push({
          x: originX,
          y: originY,
          vx: Math.cos(angle) * (0.5 + intensity * 1.5),
          vy: Math.sin(angle) * (0.5 + intensity * 1.5) - 0.3,
          alpha: 0.9,
          radius: Math.random() * 2.5 + 1,
          hue
        });
      }
    }

    function drawMotes(slot) {
      motes[slot].forEach((m) => {
        m.x += m.vx;
        m.y += m.vy;
        m.alpha -= 0.01;
        ctx.fillStyle = `hsla(${m.hue}, 100%, 78%, ${Math.max(0, m.alpha)})`;
        ctx.beginPath();
        ctx.arc(m.x, m.y, m.radius, 0, Math.PI * 2);
        ctx.fill();
      });
      motes[slot] = motes[slot].filter((m) => m.alpha > 0);
    }

    function playReleaseSound() {
      const now = Tone.now();
      if (releaseSynth) {
        releaseSynth.triggerAttack('A2', now);
        releaseSynth.frequency.exponentialRampToValueAtTime(880, now + 0.15);
        releaseSynth.triggerRelease(now + 0.3);
      }
      if (releaseNoise) releaseNoise.triggerAttackRelease('8n');
      if (releaseBoom) releaseBoom.triggerAttackRelease('C1', '4n');
    }

    function updateFaceSlot(slot, face, now) {
      const box = getBoundingBox(face);
      const hue = HUE_BASE[slot];

      if (!wasFacePresent[slot]) {
        charge[slot] = 0;
        armed[slot] = true;
      }
      wasFacePresent[slot] = true;

      const mouthRatio = getMouthOpenRatio(face);
      const targetCharge = mapRange(mouthRatio, MOUTH_OPEN_MIN, MOUTH_OPEN_MAX, 0, 1);
      // smooth the charge value slightly so it doesn't flicker on frame-to-frame jitter
      charge[slot] += (targetCharge - charge[slot]) * 0.35;

      const centerX = box.x + box.width / 2;
      const centerY = box.y + box.height / 2;

      if (armed[slot] && charge[slot] >= 0.97) {
        armed[slot] = false;
        spawnShockwave(centerX, centerY, hue);
        spawnBurst(centerX, centerY, 55, hue);
        triggerFlash(0.6);
        playReleaseSound();
      }

      if (!armed[slot] && mouthRatio < REARM_THRESHOLD) {
        armed[slot] = true;
      }

      drawChargeRing(box, charge[slot], hue);
      spawnMotes(slot, box, hue, charge[slot]);
      drawMotes(slot);
    }

    function resetFaceSlot(slot) {
      wasFacePresent[slot] = false;
      charge[slot] = 0;
      armed[slot] = true;
    }

    function drawIdleGlow(time) {
      const centerX = canvas.width / 2;
      const centerY = canvas.height / 2;
      const pulse = Math.sin(time / 800) * 0.3 + 0.7;

      const gradient = ctx.createRadialGradient(centerX, centerY, 0, centerX, centerY, 150);
      gradient.addColorStop(0, `rgba(127, 255, 212, ${0.3 * pulse})`);
      gradient.addColorStop(1, 'rgba(0, 0, 0, 0)');
      ctx.fillStyle = gradient;
      ctx.beginPath();
      ctx.arc(centerX, centerY, 150, 0, Math.PI * 2);
      ctx.fill();

      drawUnmirroredText('OPEN MOUTH TO CHARGE', centerX, centerY + 170, 'rgba(127, 255, 212, 0.85)', canvas.width * 0.02);
    }

    function animationLoop() {
      const now = performance.now();
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      if (faceLandmarker && video.readyState >= 2) {
        try {
          const results = faceLandmarker.detectForVideo(video, now);
          const faces = results.faceLandmarks || [];

          if (faces.length === 0) {
            drawIdleGlow(now);
            resetFaceSlot(0);
            resetFaceSlot(1);
          } else {
            faces.forEach((face, index) => {
              if (index > 1) return;
              updateFaceSlot(index, face, now);
            });
            if (faces.length < 2) resetFaceSlot(1);
          }
        } catch (error) {
          console.error("Detection error:", error);
        }
      }

      drawShockwaves();
      drawBurstParticles();

      requestAnimationFrame(animationLoop);
    }
  </script>

</body>
</html>
