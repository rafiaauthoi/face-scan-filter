<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Face Scan Filter</title>
  <script src="https://cdn.jsdelivr.net/npm/tone@14.8.49/build/Tone.js"></script>
  <style>
    body {
      background-color: #050505;
      color: #eaeaea;
      font-family: monospace;
      text-align: center;
      padding-top: 30px;
      margin: 0;
    }

    h1 {
      color: #ff2fb0;
      text-shadow: 0 0 12px #ff2fb0;
      letter-spacing: 2px;
    }

    #startButton {
      background-color: #ff2fb0;
      color: #0a0a0a;
      border: none;
      padding: 12px 24px;
      font-family: monospace;
      font-size: 14px;
      font-weight: bold;
      border-radius: 6px;
      cursor: pointer;
      margin-top: 10px;
    }

    #startButton:hover {
      background-color: #ff5fc4;
    }

    #main-row {
      display: none;
      justify-content: center;
      align-items: flex-start;
      gap: 20px;
      margin-top: 20px;
      flex-wrap: wrap;
    }

    #video-wrapper {
      position: relative;
      width: 65vw;
      max-width: 950px;
      aspect-ratio: 4 / 3;
      border: 3px solid #ff2fb0;
      border-radius: 8px;
      overflow: hidden;
      box-shadow: 0 0 30px rgba(255, 47, 176, 0.4);
      background-color: #000;
      transition: border-color 0.6s ease, box-shadow 0.6s ease;
    }

    video {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      transform: scaleX(-1);
      opacity: 0.55;
    }

    canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      transform: scaleX(-1);
    }

    #flash-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-color: rgba(255, 255, 255, 0.9);
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.5s ease;
    }

    #candy-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background-color: rgba(5, 5, 5, 0.85);
    }

    #candy-overlay.visible {
      display: flex;
    }

    #candy-overlay h2 {
      color: #ffe64d;
      text-shadow: 0 0 14px #ffe64d;
      font-size: 26px;
      margin-bottom: 8px;
    }

    #candy-overlay p {
      color: #7fffd4;
      font-size: 15px;
      margin: 4px 0;
    }

    #candy-overlay button {
      background-color: #ff2fb0;
      color: #0a0a0a;
      border: none;
      padding: 10px 22px;
      font-family: monospace;
      font-size: 13px;
      font-weight: bold;
      border-radius: 6px;
      cursor: pointer;
      margin-top: 14px;
    }

    #side-panel {
      width: 200px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
    }

    #surpriseButton {
      background-color: transparent;
      color: #7fffd4;
      border: 2px dashed #7fffd4;
      padding: 14px 16px;
      font-family: monospace;
      font-size: 13px;
      font-weight: bold;
      border-radius: 8px;
      cursor: pointer;
      line-height: 1.4;
    }

    #surpriseButton:hover {
      background-color: rgba(127, 255, 212, 0.15);
    }

    #surpriseButton.active {
      border-style: solid;
      background-color: rgba(255, 47, 176, 0.15);
      border-color: #ff2fb0;
      color: #ff2fb0;
    }

    #status {
      margin-top: 14px;
      font-size: 14px;
      color: #888;
    }
  </style>
</head>
<body>

  <h1>FACE SCAN FILTER</h1>
  <button id="startButton">Start Scan</button>

  <div id="main-row">
    <div id="video-wrapper">
      <video id="webcam" autoplay playsinline></video>
      <canvas id="overlay" width="960" height="720"></canvas>
      <div id="flash-overlay"></div>
      <div id="candy-overlay">
        <h2 id="candyResultTitle">READY?</h2>
        <p id="candyResultScore">Swing your mouth under a candy and bite to eat it!</p>
        <button id="candyPlayAgainButton">Start Round</button>
      </div>
    </div>

    <div id="side-panel">
      <button id="surpriseButton">Click me for<br />a surprise</button>
    </div>
  </div>

  <p id="status">Click "Start Scan" to begin.</p>

  <script type="module">
    import {
      FaceLandmarker,
      FilesetResolver
    } from "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14";

    const video = document.getElementById('webcam');
    const canvas = document.getElementById('overlay');
    const ctx = canvas.getContext('2d');
    const status = document.getElementById('status');
    const startButton = document.getElementById('startButton');
    const mainRow = document.getElementById('main-row');
    const videoWrapper = document.getElementById('video-wrapper');
    const flashOverlay = document.getElementById('flash-overlay');
    const candyOverlay = document.getElementById('candy-overlay');
    const candyResultTitle = document.getElementById('candyResultTitle');
    const candyResultScore = document.getElementById('candyResultScore');
    const candyPlayAgainButton = document.getElementById('candyPlayAgainButton');
    const surpriseButton = document.getElementById('surpriseButton');

    let faceLandmarker;
    let audioReady = false;
    let smileChime, candyCrunch, roundEndChime;

    // 'candy' is the main game, 'affirmation' is the side surprise mode
    let currentMode = 'candy';

    const MOUTH_OPEN_MIN = 0.045;
    const MOUTH_OPEN_MAX = 0.16;
    const SMILE_RATIO_THRESHOLD = 0.95;

    let burstParticles = [];

    function mapRange(value, inMin, inMax, outMin, outMax) {
      const t = Math.max(0, Math.min(1, (value - inMin) / (inMax - inMin)));
      return outMin + t * (outMax - outMin);
    }

    function drawUnmirroredText(text, x, y, color, fontSize, align) {
      ctx.save();
      ctx.translate(x, y);
      ctx.scale(-1, 1);
      ctx.fillStyle = color;
      ctx.font = fontSize + 'px monospace';
      ctx.textAlign = align || 'center';
      ctx.fillText(text, 0, 0);
      ctx.restore();
    }

    function getBoundingBox(landmarks) {
      let minX = 1, minY = 1, maxX = 0, maxY = 0;
      landmarks.forEach((point) => {
        if (point.x < minX) minX = point.x;
        if (point.x > maxX) maxX = point.x;
        if (point.y < minY) minY = point.y;
        if (point.y > maxY) maxY = point.y;
      });
      return {
        x: minX * canvas.width,
        y: minY * canvas.height,
        width: (maxX - minX) * canvas.width,
        height: (maxY - minY) * canvas.height
      };
    }

    function getMouthOpenRatio(face) {
      const upperLip = face[13];
      const lowerLip = face[14];
      const forehead = face[10];
      const chin = face[152];
      const mouthGap = Math.hypot(lowerLip.x - upperLip.x, lowerLip.y - upperLip.y);
      const faceHeight = Math.hypot(chin.x - forehead.x, chin.y - forehead.y);
      return mouthGap / faceHeight;
    }

    function getSmileRatio(face) {
      const mouthLeft = face[61];
      const mouthRight = face[291];
      const eyeLeft = face[33];
      const eyeRight = face[263];
      const mouthWidth = Math.hypot(mouthRight.x - mouthLeft.x, mouthRight.y - mouthLeft.y);
      const eyeDistance = Math.hypot(eyeRight.x - eyeLeft.x, eyeRight.y - eyeLeft.y);
      return mouthWidth / eyeDistance;
    }

    function getMouthCenter(face) {
      const upperLip = face[13];
      const lowerLip = face[14];
      return {
        x: ((upperLip.x + lowerLip.x) / 2) * canvas.width,
        y: ((upperLip.y + lowerLip.y) / 2) * canvas.height
      };
    }

    function triggerFlash(strength) {
      flashOverlay.style.transition = 'opacity 0.05s ease';
      flashOverlay.style.opacity = String(strength);
      setTimeout(() => {
        flashOverlay.style.transition = 'opacity 0.5s ease';
        flashOverlay.style.opacity = '0';
      }, 60);
    }

    function spawnBurst(x, y, count, hue) {
      for (let i = 0; i < count; i++) {
        const angle = (Math.PI * 2 * i) / count + Math.random() * 0.3;
        const speed = Math.random() * 7 + 3;
        burstParticles.push({
          x, y,
          vx: Math.cos(angle) * speed,
          vy: Math.sin(angle) * speed,
          alpha: 1,
          radius: Math.random() * 4 + 2,
          hue
        });
      }
    }

    function drawBurstParticles() {
      burstParticles.forEach((p) => {
        p.x += p.vx;
        p.vx *= 0.95;
        p.y += p.vy;
        p.vy *= 0.95;
        p.alpha -= 0.02;
        ctx.fillStyle = `hsla(${p.hue}, 100%, 70%, ${Math.max(0, p.alpha)})`;
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
        ctx.fill();
      });
      burstParticles = burstParticles.filter((p) => p.alpha > 0);
    }

    // ===================== AUDIO =====================

    async function setupAudio() {
      await Tone.start();

      smileChime = new Tone.PolySynth(Tone.Synth, {
        oscillator: { type: 'sine' },
        envelope: { attack: 0.02, decay: 0.3, sustain: 0.15, release: 0.6 }
      }).toDestination();
      smileChime.volume.value = -4;

      candyCrunch = new Tone.NoiseSynth({
        noise: { type: 'white' },
        envelope: { attack: 0.001, decay: 0.08, sustain: 0 }
      }).toDestination();
      candyCrunch.volume.value = -6;

      roundEndChime = new Tone.PolySynth(Tone.Synth, {
        oscillator: { type: 'sine' },
        envelope: { attack: 0.02, decay: 0.4, sustain: 0.2, release: 0.6 }
      }).toDestination();
      roundEndChime.volume.value = -6;

      await Tone.loaded();
      audioReady = true;
    }

    // ===================== SETUP =====================

    async function setupFaceLandmarker() {
      const vision = await FilesetResolver.forVisionTasks(
        "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/wasm"
      );

      faceLandmarker = await FaceLandmarker.createFromOptions(vision, {
        baseOptions: {
          modelAssetPath:
            "https://storage.googleapis.com/mediapipe-models/face_landmarker/face_landmarker/float16/1/face_landmarker.task",
          delegate: "GPU"
        },
        runningMode: "VIDEO",
        numFaces: 1
      });

      status.textContent = "Model loaded. Starting camera...";
      startWebcam();
    }

    async function startWebcam() {
      try {
        const stream = await navigator.mediaDevices.getUserMedia({
          video: {
            width: { ideal: 640 },
            height: { ideal: 480 }
          },
          audio: false
        });
        video.srcObject = stream;

        video.addEventListener('loadeddata', () => {
          status.textContent = "Click Start Round to begin.";
          mainRow.style.display = 'flex';
          candyOverlay.classList.add('visible');
          animationLoop();
        });
      } catch (error) {
        status.textContent = "Camera access failed: " + error.message;
      }
    }

    startButton.addEventListener('click', async () => {
      startButton.disabled = true;
      startButton.textContent = "Starting...";
      try {
        await setupAudio();
      } catch (error) {
        console.error("Audio setup failed, continuing without sound:", error);
      }
      status.textContent = "Loading tracking model...";
      setupFaceLandmarker();
      startButton.style.display = 'none';
    });

    // ===================== SURPRISE TOGGLE =====================

    surpriseButton.addEventListener('click', () => {
      if (currentMode === 'candy') {
        currentMode = 'affirmation';
        surpriseButton.textContent = 'Back to Candy Game';
        surpriseButton.classList.add('active');
        candyOverlay.classList.remove('visible');
        if (candyRoundTimerId) clearInterval(candyRoundTimerId);
        status.textContent = "Smile for a surprise!";
        instructionAlpha = 1;
      } else {
        currentMode = 'candy';
        surpriseButton.textContent = 'Click me for a surprise';
        surpriseButton.classList.remove('active');
        videoWrapper.style.borderColor = '#ff2fb0';
        videoWrapper.style.boxShadow = '0 0 30px rgba(255, 47, 176, 0.4)';

        if (!candyRoundActive) {
          candyResultTitle.textContent = 'READY?';
          candyResultScore.textContent = 'Swing your mouth under a candy and bite to eat it!';
          candyPlayAgainButton.textContent = 'Start Round';
          candyOverlay.classList.add('visible');
        } else if (candyRoundTimerId === null) {
          // resume the timer if a round was in progress when we switched away
          candyRoundTimerId = setInterval(() => {
            candyTimeLeft -= 100;
            if (candyTimeLeft <= 0) endCandyRound();
          }, 100);
        }
        status.textContent = "Click Start Round to begin.";
      }
    });

    // ===================== SIDE SURPRISE: AFFIRMATIONS =====================

    const AFFIRMATIONS = [
      { text: 'you are exactly where you need to be', hue: 320 },
      { text: 'your energy is contagious, in the best way', hue: 170 },
      { text: 'you make hard things look easy', hue: 45 },
      { text: 'someone is grateful you exist today', hue: 280 },
      { text: 'you are allowed to take up space', hue: 200 },
      { text: 'your smile just made someone else smile', hue: 330 },
      { text: 'you are more capable than you give yourself credit for', hue: 150 },
      { text: 'today is lucky to have you in it', hue: 40 },
      { text: 'you are doing better than you think', hue: 260 },
      { text: 'your presence changes a room for the better', hue: 300 }
    ];

    let wasSmiling = false;
    let currentAffirmation = null;
    let instructionAlpha = 1;

    // flowers array declared BEFORE anything uses it, this was the actual crash bug last time
    let flowers = [];
    for (let i = 0; i < 10; i++) {
      spawnFlower(true);
    }

    function spawnFlower(initial) {
      const edge = Math.floor(Math.random() * 4);
      let x, y;
      if (edge === 0) { x = Math.random() * canvas.width; y = -20; }
      else if (edge === 1) { x = canvas.width + 20; y = Math.random() * canvas.height; }
      else if (edge === 2) { x = Math.random() * canvas.width; y = canvas.height + 20; }
      else { x = -20; y = Math.random() * canvas.height; }

      if (initial) {
        x = Math.random() * canvas.width;
        y = Math.random() * canvas.height;
      }

      flowers.push({
        x, y,
        vx: (Math.random() - 0.5) * 0.3,
        vy: (Math.random() - 0.5) * 0.3,
        size: Math.random() * 6 + 6,
        hue: Math.random() * 360,
        sway: Math.random() * Math.PI * 2
      });
    }

    function drawPixelFlower(f, time) {
      const swayX = Math.sin(time / 1500 + f.sway) * 4;
      const cx = f.x + swayX;
      const cy = f.y;
      const s = f.size;

      ctx.fillStyle = `hsla(${f.hue}, 90%, 70%, 0.55)`;
      const offsets = [[0, -s], [s, 0], [0, s], [-s, 0]];
      offsets.forEach(([ox, oy]) => {
        ctx.fillRect(cx + ox - s / 2, cy + oy - s / 2, s, s);
      });

      ctx.fillStyle = `hsla(${(f.hue + 40) % 360}, 100%, 75%, 0.8)`;
      ctx.fillRect(cx - s / 2, cy - s / 2, s, s);
    }

    function updateFlowers(time) {
      flowers.forEach((f) => {
        f.x += f.vx;
        f.y += f.vy;
        drawPixelFlower(f, time);
      });

      flowers = flowers.filter((f) =>
        f.x > -30 && f.x < canvas.width + 30 && f.y > -30 && f.y < canvas.height + 30
      );
      while (flowers.length < 10) {
        spawnFlower(false);
      }
    }

    function runAffirmationMode(face, now) {
      updateFlowers(now);

      if (!face) {
        drawBurstParticles();
        return;
      }

      const smileRatio = getSmileRatio(face);
      const isSmiling = smileRatio > SMILE_RATIO_THRESHOLD;

      if (isSmiling && !wasSmiling) {
        currentAffirmation = AFFIRMATIONS[Math.floor(Math.random() * AFFIRMATIONS.length)];
        instructionAlpha = 0;

        const box = getBoundingBox(face);
        const centerX = box.x + box.width / 2;
        const centerY = box.y + box.height / 2;

        videoWrapper.style.borderColor = `hsl(${currentAffirmation.hue}, 100%, 60%)`;
        videoWrapper.style.boxShadow = `0 0 30px hsla(${currentAffirmation.hue}, 100%, 55%, 0.6)`;

        spawnBurst(centerX, centerY, 40, currentAffirmation.hue);
        triggerFlash(0.4);
        if (smileChime) smileChime.triggerAttackRelease(['C5', 'E5', 'G5'], '4n');
      }
      wasSmiling = isSmiling;

      if (instructionAlpha > 0) {
        drawUnmirroredText('SMILE FOR A SURPRISE', canvas.width / 2, canvas.height * 0.9, `rgba(255, 47, 176, ${instructionAlpha})`, canvas.width * 0.02);
      }

      if (currentAffirmation) {
        const box = getBoundingBox(face);
        drawUnmirroredText(
          '"' + currentAffirmation.text + '"',
          box.x + box.width / 2,
          box.y - canvas.height * 0.04,
          `hsla(${currentAffirmation.hue}, 100%, 78%, 0.95)`,
          canvas.width * 0.018,
          'center'
        );
      }

      drawBurstParticles();
    }

    // ===================== MAIN GAME: CANDY =====================

    const ROUND_DURATION_MS = 30000;
    const CANDY_COUNT = 4;
    const CANDY_RADIUS = 26;
    const CANDY_EAT_DISTANCE = 55;
    const CANDY_EAT_MOUTH_RATIO = 0.09;

    let candyRoundActive = false;
    let candyTimeLeft = ROUND_DURATION_MS;
    let candyScore = 0;
    let candies = [];
    let candyRoundTimerId = null;

    function spawnCandy() {
      return {
        baseX: Math.random() * canvas.width * 0.7 + canvas.width * 0.15,
        y: Math.random() * canvas.height * 0.15 + canvas.height * 0.08,
        swayAmount: Math.random() * 60 + 40,
        swaySpeed: Math.random() * 0.0015 + 0.001,
        swayOffset: Math.random() * Math.PI * 2,
        hue: Math.random() * 360
      };
    }

    function startCandyRound() {
      candyRoundActive = true;
      candyTimeLeft = ROUND_DURATION_MS;
      candyScore = 0;
      candies = [];
      for (let i = 0; i < CANDY_COUNT; i++) {
        candies.push(spawnCandy());
      }
      candyOverlay.classList.remove('visible');

      if (candyRoundTimerId) clearInterval(candyRoundTimerId);
      candyRoundTimerId = setInterval(() => {
        candyTimeLeft -= 100;
        if (candyTimeLeft <= 0) {
          endCandyRound();
        }
      }, 100);
    }

    function endCandyRound() {
      candyRoundActive = false;
      if (candyRoundTimerId) {
        clearInterval(candyRoundTimerId);
        candyRoundTimerId = null;
      }
      candyResultTitle.textContent = "TIME'S UP";
      candyResultScore.textContent = 'Candies eaten: ' + candyScore;
      candyPlayAgainButton.textContent = 'Play Again';
      candyOverlay.classList.add('visible');
      if (roundEndChime) roundEndChime.triggerAttackRelease(['C4', 'E4', 'G4'], '2n');
    }

    candyPlayAgainButton.addEventListener('click', startCandyRound);

    function drawPixelCandy(x, y, hue) {
      ctx.save();
      ctx.translate(x, y);

      const gradient = ctx.createRadialGradient(0, 0, 0, 0, 0, CANDY_RADIUS * 1.4);
      gradient.addColorStop(0, `hsla(${hue}, 100%, 65%, 0.35)`);
      gradient.addColorStop(1, 'rgba(0,0,0,0)');
      ctx.fillStyle = gradient;
      ctx.beginPath();
      ctx.arc(0, 0, CANDY_RADIUS * 1.4, 0, Math.PI * 2);
      ctx.fill();

      ctx.fillStyle = `hsl(${hue}, 90%, 60%)`;
      ctx.beginPath();
      ctx.arc(0, 0, CANDY_RADIUS * 0.7, 0, Math.PI * 2);
      ctx.fill();

      ctx.fillStyle = `hsl(${hue}, 100%, 80%)`;
      ctx.beginPath();
      ctx.arc(-CANDY_RADIUS * 0.2, -CANDY_RADIUS * 0.2, CANDY_RADIUS * 0.2, 0, Math.PI * 2);
      ctx.fill();

      ctx.strokeStyle = 'rgba(255, 255, 255, 0.4)';
      ctx.lineWidth = 1.5;
      ctx.beginPath();
      ctx.moveTo(0, -CANDY_RADIUS * 0.7);
      ctx.lineTo(0, -CANDY_RADIUS * 2.2);
      ctx.stroke();

      ctx.restore();
    }

    function runCandyMode(face, now) {
      drawUnmirroredText('TIME: ' + Math.max(0, Math.ceil(candyTimeLeft / 1000)) + 's', canvas.width - canvas.width * 0.15, canvas.height * 0.06, 'rgba(127, 255, 212, 0.9)', canvas.width * 0.022);
      drawUnmirroredText('SCORE: ' + candyScore, canvas.width * 0.15, canvas.height * 0.06, 'rgba(255, 47, 176, 0.9)', canvas.width * 0.022);

      if (!candyRoundActive) {
        drawBurstParticles();
        return;
      }

      const mouthCenter = face ? getMouthCenter(face) : null;
      const mouthOpenRatio = face ? getMouthOpenRatio(face) : 0;

      candies.forEach((candy, index) => {
        const swingX = candy.baseX + Math.sin(now * candy.swaySpeed + candy.swayOffset) * candy.swayAmount;
        drawPixelCandy(swingX, candy.y, candy.hue);

        if (mouthCenter) {
          const dist = Math.hypot(mouthCenter.x - swingX, mouthCenter.y - candy.y);
          if (dist < CANDY_EAT_DISTANCE && mouthOpenRatio > CANDY_EAT_MOUTH_RATIO) {
            candyScore++;
            spawnBurst(swingX, candy.y, 25, candy.hue);
            if (candyCrunch) candyCrunch.triggerAttackRelease('16n');
            candies[index] = spawnCandy();
          }
        }
      });

      drawBurstParticles();
    }

    // ===================== MAIN LOOP =====================

    function animationLoop() {
      const now = performance.now();
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      let face = null;

      if (faceLandmarker && video.readyState >= 2) {
        try {
          const results = faceLandmarker.detectForVideo(video, now);
          if (results.faceLandmarks && results.faceLandmarks.length > 0) {
            face = results.faceLandmarks[0];
          }
        } catch (error) {
          console.error("Detection error:", error);
        }
      }

      if (currentMode === 'candy') {
        runCandyMode(face, now);
      } else {
        runAffirmationMode(face, now);
      }

      requestAnimationFrame(animationLoop);
    }
  </script>

</body>
</html>
