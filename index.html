<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Face Scan Filter</title>
  <script src="https://cdn.jsdelivr.net/npm/tone@14.8.49/build/Tone.js"></script>
  <style>
    body {
      background-color: #050505;
      color: #eaeaea;
      font-family: monospace;
      text-align: center;
      padding-top: 30px;
      margin: 0;
    }

    h1 {
      color: #ff2fb0;
      text-shadow: 0 0 12px #ff2fb0;
      letter-spacing: 2px;
    }

    #startButton, #captureButton {
      background-color: #ff2fb0;
      color: #0a0a0a;
      border: none;
      padding: 12px 24px;
      font-family: monospace;
      font-size: 14px;
      font-weight: bold;
      border-radius: 6px;
      cursor: pointer;
      margin-top: 10px;
    }

    #startButton:hover, #captureButton:hover {
      background-color: #ff5fc4;
    }

    #captureButton {
      display: none;
      background-color: #7fffd4;
      color: #050505;
    }

    #captureButton:hover {
      background-color: #a3ffe4;
    }

    #video-wrapper {
      position: relative;
      width: 65vw;
      max-width: 950px;
      aspect-ratio: 4 / 3;
      margin: 20px auto 0;
      border: 2px solid #ff2fb0;
      border-radius: 8px;
      overflow: hidden;
      box-shadow: 0 0 30px rgba(255, 47, 176, 0.4);
      background-color: #000;
    }

    video {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      transform: scaleX(-1);
      opacity: 0.55;
    }

    canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      transform: scaleX(-1);
    }

    #flash-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-color: rgba(255, 255, 255, 0.9);
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.5s ease;
    }

    #status {
      margin-top: 14px;
      font-size: 14px;
      color: #888;
    }
  </style>
</head>
<body>

  <h1>FACE SCAN FILTER</h1>
  <button id="startButton">Start Scan</button>
  <button id="captureButton">Capture Snapshot</button>

  <div id="video-wrapper">
    <video id="webcam" autoplay playsinline></video>
    <canvas id="overlay" width="960" height="720"></canvas>
    <div id="flash-overlay"></div>
  </div>
  <p id="status">Click "Start Scan" to begin.</p>

  <script type="module">
    import {
      FaceLandmarker,
      FilesetResolver
    } from "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14";

    const video = document.getElementById('webcam');
    const canvas = document.getElementById('overlay');
    const ctx = canvas.getContext('2d');
    const status = document.getElementById('status');
    const startButton = document.getElementById('startButton');
    const captureButton = document.getElementById('captureButton');
    const flashOverlay = document.getElementById('flash-overlay');

    let faceLandmarker;
    let audioReady = false;
    let scanBeep, shutterNoise, identityChime;

    // hand-curated pairs, name plus a matching poetic line, written together
    // on purpose so nothing ever feels like a mismatched random pairing
    const IDENTITIES = [
      { name: 'ECHO WRAITH', line: 'you move like static before the signal clears' },
      { name: 'NEON ORACLE', line: 'you already know how this ends' },
      { name: 'VOID DRIFTER', line: 'gravity is a suggestion where you walk' },
      { name: 'CRIMSON SENTINEL', line: 'something is always watching back' },
      { name: 'CHROME NOMAD', line: 'home is wherever the light bends next' },
      { name: 'SILENT HARBINGER', line: 'the quiet before you is not an accident' },
      { name: 'GLITCH SAINT', line: 'even your mistakes look intentional' },
      { name: 'LUNAR REAPER', line: 'you collect endings the way others collect starts' },
      { name: 'PHANTOM CIPHER', line: 'no one has ever fully decoded you' },
      { name: 'FROST SPECTER', line: 'you leave a chill in rooms you have already left' },
      { name: 'RUST PROPHET', line: 'you saw this coming before the wiring did' },
      { name: 'HOLLOW MIRAGE', line: 'not everyone who sees you believes you' }
    ];

    let wasFacePresent = [false, false];
    let identity = [null, null];
    let motes = [[], []];
    let burstParticles = [];

    const HUE_BASE = [320, 170];

    function pickIdentity() {
      return IDENTITIES[Math.floor(Math.random() * IDENTITIES.length)];
    }

    async function setupAudio() {
      await Tone.start();

      scanBeep = new Tone.Synth({
        oscillator: { type: 'sine' },
        envelope: { attack: 0.01, decay: 0.1, sustain: 0, release: 0.1 }
      }).toDestination();
      scanBeep.volume.value = -10;

      shutterNoise = new Tone.NoiseSynth({
        noise: { type: 'white' },
        envelope: { attack: 0.001, decay: 0.05, sustain: 0 }
      }).toDestination();
      shutterNoise.volume.value = -8;

      identityChime = new Tone.PolySynth(Tone.Synth, {
        oscillator: { type: 'sine' },
        envelope: { attack: 0.02, decay: 0.3, sustain: 0.15, release: 0.6 }
      }).toDestination();
      identityChime.volume.value = -4;

      await Tone.loaded();
      audioReady = true;
    }

    async function setupFaceLandmarker() {
      const vision = await FilesetResolver.forVisionTasks(
        "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/wasm"
      );

      faceLandmarker = await FaceLandmarker.createFromOptions(vision, {
        baseOptions: {
          modelAssetPath:
            "https://storage.googleapis.com/mediapipe-models/face_landmarker/face_landmarker/float16/1/face_landmarker.task",
          delegate: "GPU"
        },
        runningMode: "VIDEO",
        numFaces: 2
      });

      status.textContent = "Model loaded. Starting camera...";
      startWebcam();
    }

    async function startWebcam() {
      try {
        const stream = await navigator.mediaDevices.getUserMedia({
          video: {
            width: { ideal: 640 },
            height: { ideal: 480 }
          },
          audio: false
        });
        video.srcObject = stream;

        video.addEventListener('loadeddata', () => {
          status.textContent = "Face the camera directly to reveal your alter ego.";
          captureButton.style.display = 'inline-block';
          animationLoop();
        });
      } catch (error) {
        status.textContent = "Camera access failed: " + error.message;
      }
    }

    startButton.addEventListener('click', async () => {
      startButton.disabled = true;
      startButton.textContent = "Starting...";
      try {
        await setupAudio();
      } catch (error) {
        console.error("Audio setup failed, continuing without sound:", error);
      }
      status.textContent = "Loading tracking model...";
      setupFaceLandmarker();
      startButton.style.display = 'none';
    });

    captureButton.addEventListener('click', () => {
      const captureCanvas = document.createElement('canvas');
      captureCanvas.width = canvas.width;
      captureCanvas.height = canvas.height;
      const captureCtx = captureCanvas.getContext('2d');

      captureCtx.translate(captureCanvas.width, 0);
      captureCtx.scale(-1, 1);
      captureCtx.drawImage(video, 0, 0, captureCanvas.width, captureCanvas.height);
      captureCtx.drawImage(canvas, 0, 0);

      captureCanvas.toBlob((blob) => {
        const link = document.createElement('a');
        link.href = URL.createObjectURL(blob);
        link.download = 'alter-ego-' + Date.now() + '.png';
        link.click();
      }, 'image/png');

      triggerFlash(0.9);
      if (shutterNoise) shutterNoise.triggerAttackRelease('16n');
    });

    function triggerFlash(strength) {
      flashOverlay.style.transition = 'opacity 0.05s ease';
      flashOverlay.style.opacity = String(strength);
      setTimeout(() => {
        flashOverlay.style.transition = 'opacity 0.5s ease';
        flashOverlay.style.opacity = '0';
      }, 60);
    }

    function spawnBurst(x, y, count, hue) {
      for (let i = 0; i < count; i++) {
        const angle = (Math.PI * 2 * i) / count + Math.random() * 0.3;
        const speed = Math.random() * 7 + 3;
        burstParticles.push({
          x, y,
          vx: Math.cos(angle) * speed,
          vy: Math.sin(angle) * speed,
          alpha: 1,
          radius: Math.random() * 4 + 2,
          hue
        });
      }
    }

    function drawBurstParticles() {
      burstParticles.forEach((p) => {
        p.x += p.vx;
        p.vx *= 0.96;
        p.y += p.vy;
        p.vy *= 0.96;
        p.alpha -= 0.02;
        ctx.fillStyle = `hsla(${p.hue}, 100%, 70%, ${Math.max(0, p.alpha)})`;
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
        ctx.fill();
      });
      burstParticles = burstParticles.filter((p) => p.alpha > 0);
    }

    function drawUnmirroredText(text, x, y, color, fontSize, align) {
      ctx.save();
      ctx.translate(x, y);
      ctx.scale(-1, 1);
      ctx.fillStyle = color;
      ctx.font = fontSize + 'px monospace';
      ctx.textAlign = align || 'center';
      ctx.fillText(text, 0, 0);
      ctx.restore();
    }

    function getBoundingBox(landmarks) {
      let minX = 1, minY = 1, maxX = 0, maxY = 0;
      landmarks.forEach((point) => {
        if (point.x < minX) minX = point.x;
        if (point.x > maxX) maxX = point.x;
        if (point.y < minY) minY = point.y;
        if (point.y > maxY) maxY = point.y;
      });
      return {
        x: minX * canvas.width,
        y: minY * canvas.height,
        width: (maxX - minX) * canvas.width,
        height: (maxY - minY) * canvas.height
      };
    }

    // ambient pool of light centered on the face, no contour tracing at all,
    // just a soft glow that breathes gently, like standing in colored light
    function drawAmbientHalo(box, hueOffset, time) {
      const hue = (HUE_BASE[hueOffset] + Math.sin(time / 4000) * 25 + 360) % 360;
      const pulse = Math.sin(time / 900) * 0.15 + 1;
      const centerX = box.x + box.width / 2;
      const centerY = box.y + box.height / 2;
      const baseRadius = Math.max(box.width, box.height) * 0.85 * pulse;

      const gradient = ctx.createRadialGradient(centerX, centerY, baseRadius * 0.3, centerX, centerY, baseRadius);
      gradient.addColorStop(0, `hsla(${hue}, 100%, 65%, 0.28)`);
      gradient.addColorStop(0.6, `hsla(${hue}, 100%, 60%, 0.12)`);
      gradient.addColorStop(1, 'rgba(0, 0, 0, 0)');

      ctx.fillStyle = gradient;
      ctx.beginPath();
      ctx.arc(centerX, centerY, baseRadius, 0, Math.PI * 2);
      ctx.fill();

      return hue;
    }

    function spawnMotes(slot, box, hue) {
      for (let i = 0; i < 2; i++) {
        if (Math.random() < 0.6) {
          const angle = Math.random() * Math.PI * 2;
          const dist = Math.random() * box.width * 0.6;
          const originX = box.x + box.width / 2 + Math.cos(angle) * dist;
          const originY = box.y + box.height / 2 + Math.sin(angle) * dist;

          motes[slot].push({
            x: originX,
            y: originY,
            vx: Math.cos(angle) * 0.5,
            vy: Math.sin(angle) * 0.5 - 0.4,
            alpha: 0.85,
            radius: Math.random() * 2.5 + 1,
            hue
          });
        }
      }
    }

    function drawMotes(slot) {
      motes[slot].forEach((m) => {
        m.x += m.vx;
        m.y += m.vy;
        m.alpha -= 0.007;
        ctx.fillStyle = `hsla(${m.hue}, 100%, 78%, ${Math.max(0, m.alpha)})`;
        ctx.beginPath();
        ctx.arc(m.x, m.y, m.radius, 0, Math.PI * 2);
        ctx.fill();
      });
      motes[slot] = motes[slot].filter((m) => m.alpha > 0);
    }

    function drawIdentityCard(box, hue, identityData) {
      const cardX = box.x;
      const cardY = box.y - canvas.height * 0.13;
      const cardWidth = box.width * 1.05;
      const cardHeight = canvas.height * 0.11;

      ctx.save();
      ctx.translate(cardX, cardY);
      ctx.scale(-1, 1);

      ctx.fillStyle = `hsla(${hue}, 60%, 14%, 0.7)`;
      ctx.strokeStyle = `hsla(${hue}, 100%, 65%, 0.9)`;
      ctx.lineWidth = 1.5;
      ctx.beginPath();
      ctx.rect(-cardWidth, -cardHeight, cardWidth, cardHeight);
      ctx.fill();
      ctx.stroke();

      ctx.fillStyle = `hsla(${hue}, 100%, 80%, 1)`;
      ctx.font = 'bold ' + (canvas.width * 0.022) + 'px monospace';
      ctx.textAlign = 'right';
      ctx.fillText(identityData.name, -cardWidth * 0.06, -cardHeight * 0.62);

      ctx.fillStyle = `hsla(${hue}, 90%, 82%, 0.85)`;
      ctx.font = 'italic ' + (canvas.width * 0.014) + 'px monospace';
      ctx.fillText('"' + identityData.line + '"', -cardWidth * 0.06, -cardHeight * 0.2);

      ctx.restore();
    }

    function updateFaceSlot(slot, face, now) {
      const box = getBoundingBox(face);

      if (!wasFacePresent[slot]) {
        identity[slot] = pickIdentity();
        const centerX = box.x + box.width / 2;
        const centerY = box.y + box.height / 2;

        spawnBurst(centerX, centerY, 45, HUE_BASE[slot]);
        triggerFlash(0.5);
        if (scanBeep) scanBeep.triggerAttackRelease('G5', '16n');
        if (identityChime) {
          identityChime.triggerAttackRelease(['C5', 'E5', 'G5', 'C6'], '4n');
        }
      }
      wasFacePresent[slot] = true;

      const hue = drawAmbientHalo(box, slot, now);
      spawnMotes(slot, box, hue);
      drawMotes(slot);
      drawBurstParticles();

      if (identity[slot]) {
        drawIdentityCard(box, hue, identity[slot]);
      }
    }

    function resetFaceSlot(slot) {
      wasFacePresent[slot] = false;
      identity[slot] = null;
    }

    function drawIdleGlow(time) {
      const centerX = canvas.width / 2;
      const centerY = canvas.height / 2;
      const pulse = Math.sin(time / 800) * 0.3 + 0.7;

      const gradient = ctx.createRadialGradient(centerX, centerY, 0, centerX, centerY, 150);
      gradient.addColorStop(0, `rgba(127, 255, 212, ${0.3 * pulse})`);
      gradient.addColorStop(1, 'rgba(0, 0, 0, 0)');
      ctx.fillStyle = gradient;
      ctx.beginPath();
      ctx.arc(centerX, centerY, 150, 0, Math.PI * 2);
      ctx.fill();

      drawUnmirroredText('STEP INTO FRAME', centerX, centerY + 170, 'rgba(127, 255, 212, 0.85)', canvas.width * 0.022);
    }

    function animationLoop() {
      const now = performance.now();
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      if (faceLandmarker && video.readyState >= 2) {
        try {
          const results = faceLandmarker.detectForVideo(video, now);
          const faces = results.faceLandmarks || [];

          if (faces.length === 0) {
            drawIdleGlow(now);
            resetFaceSlot(0);
            resetFaceSlot(1);
            drawBurstParticles();
          } else {
            faces.forEach((face, index) => {
              if (index > 1) return;
              updateFaceSlot(index, face, now);
            });
            if (faces.length < 2) resetFaceSlot(1);
          }
        } catch (error) {
          console.error("Detection error:", error);
        }
      }

      requestAnimationFrame(animationLoop);
    }
  </script>

</body>
</html>
